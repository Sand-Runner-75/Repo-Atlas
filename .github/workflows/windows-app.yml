name: Windows app

# Builds the Repo Atlas installer for Windows. Every run uploads it as a downloadable artifact;
# pushing a tag like v0.2.0 also publishes it on the repository's Releases page, with the signed
# update files (latest.json + .sig) the app's one-click updater reads.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The update key is a repository secret, so builds without it (pull requests from forks) skip the update files
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build
          else npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'; fi

      # latest.json tells installed apps the newest version, where its installer is and its signature.
      # The installer is renamed without spaces so its download address matches the release asset's name.
      - name: Write update files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe | head -1)
          name=${exe// /.}
          [ "$exe" = "$name" ] || { mv "$exe" "$name"; mv "$exe.sig" "$name.sig"; }
          node -e '
            const fs = require("fs"), [name, tag] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version: tag.replace(/^v/, ""), pub_date: new Date().toISOString(),
              notes: "See the release page on GitHub.",
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(name + ".sig", "utf8"),
                url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}` } },
            }, null, 2));' "$name" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Repo-Atlas-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
